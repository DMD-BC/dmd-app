<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c4d">
  <meta name="color-scheme" content="light dark">
  <title>Página publicada | dmd</title>
  <meta id="meta-descripcion-pagina" name="description" content="Página web creada con dmd.">
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var p = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        ? "ios"
        : /Android/i.test(ua)
          ? "android"
          : "desktop";
      document.documentElement.dataset.platform = p;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="published-body">
  <a class="skip-link" href="#contenido-publicado">Saltar al contenido principal</a>

  <main id="contenido-publicado" class="published-main" tabindex="-1">
    <div id="pagina-publicada-raiz" class="published-shell">
      <div class="card published-loading">
        <p>Cargando página...</p>
      </div>
    </div>

    <div id="pagina-no-encontrada" class="container published-missing" hidden>
      <section class="card">
        <h1>Página no disponible</h1>
        <p class="lead">No encontramos este enlace.</p>
        <div class="hero-actions">
          <a class="btn btn-primary btn-full" href="app.html">Ir al chat</a>
          <a class="btn btn-secondary btn-full" href="index.html">Inicio</a>
        </div>
      </section>
    </div>
  </main>

  <aside id="barra-publicada" class="published-bar" aria-label="Acciones de la página publicada" hidden>
    <div class="container published-bar-inner">
      <div class="published-bar-actions">
        <button id="btn-pub-copiar" class="btn btn-secondary btn-sm" type="button">
          Copiar enlace
        </button>
        <a id="btn-pub-compartir" class="btn btn-primary btn-sm" href="#" target="_blank" rel="noopener noreferrer" hidden>
          WhatsApp
        </a>
        <a class="btn btn-secondary btn-sm" href="app.html">
          Volver al chat
        </a>
      </div>
      <p id="estado-barra-publicada" class="status-banner" role="status" aria-live="polite"></p>
    </div>
  </aside>

  <footer class="published-footer">
    <div class="container published-footer-inner">
      <span>Página creada con dmd</span>
      <a class="footer-link" href="legal.html">Legal y contacto</a>
    </div>
  </footer>

  <script src="almacen.js"></script>
  <script src="generador.js"></script>
  <script src="ver.js"></script>
</body>
</html>
